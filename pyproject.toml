[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasbot"
version = "1.1.0"
description = "Discord bot for TrueNAS: on-demand status via slash commands and pushed alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.7,<3",
    "aiohttp>=3.9",
    # Official iXsystems client. The 27 tag speaks SCRAM (TrueNAS 26 beta / 27+) *and*
    # explicit PLAIN API-key auth (TrueNAS 25.04 / 25.10), so one pin covers both.
    "truenas_api_client @ git+https://github.com/truenas/api_client.git@TS-27.0.0-RC.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "websockets>=13"]

[project.scripts]
nasbot = "nasbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["SIM105", "ASYNC109"]  # timeout= is forwarded to the TrueNAS call deadline
